<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 180 960 610" width="1440" height="915" role="img" aria-labelledby="title desc">
<title id="title">المخطط التصوري لمنتزه مسقط | Muscat park concept</title>
<desc id="desc">مخطط تصوري بخمس مناطق: مدينة الألعاب غرباً، الحديقة المائية شرقاً، ممشى المدينة في الوسط، المواقف شمالاً والخدمات الفنية شمال غرب. Vector reconstruction of the supplied composition: amusement park west, water park east, City Walk centre, parking north and technical area northwest. The source area labels total 37 hectares; they are not measured survey areas. No map imagery is embedded.</desc>
